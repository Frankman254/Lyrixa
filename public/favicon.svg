<svg width="64" height="64" viewBox="0 0 64 64" fill="none"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lyrixa">
  <title>Lyrixa</title>
  <!--
    Gramática de la suite (ver .agents/MARCA.md): monograma con aberración
    cromática — magenta a la izquierda, cian a la derecha, neutro encima — que
    atraviesa su propio fondo. Aquí el fondo es una línea de tiempo: a la
    izquierda del palo de la L, marcas de tiempo; a la derecha, bloques de
    letra. El palo es el punto de sincronía. Ámbar = acento de Lyrixa.
    Transparente: solo el neutro cambia con el tema.
  -->
  <style>
    .n { stroke: #F2F3F5; }
    @media (prefers-color-scheme: light) { .n { stroke: #14171d; } }
  </style>
  <mask id="pierce">
    <rect x="0" y="0" width="64" height="64" fill="white"/>
    <path d="M22 12 V47 H48" fill="none" stroke="black" stroke-width="10"
          stroke-linecap="round" stroke-linejoin="round"/>
  </mask>
  <g mask="url(#pierce)" fill="none" stroke-linecap="round">
    <path class="n" d="M8 20 H14 M30 20 H56" stroke-width="3.4"/>
    <path d="M8 29.5 H14 M30 29.5 H44" stroke="#f5b83d" stroke-width="3"/>
    <path d="M8 39 H14 M30 39 H38 M44 39 H54" stroke="#f5b83d" stroke-width="3"/>
  </g>
  <g fill="none" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 12 V47 H48" stroke="#f0409b" transform="translate(-2.6 0)"/>
    <path d="M22 12 V47 H48" stroke="#21dde8" transform="translate(2.6 0)"/>
    <path class="n" d="M22 12 V47 H48"/>
  </g>
</svg>
